function init() {
  var saved = null
  try { saved = JSON.parse(localStorage.getItem('ambria_hub')) } catch (e) {}
  if (saved && saved.name && saved.apps) {
    state.user = saved
    state.user.is_admin = saved.is_admin || false
    renderHub()
  }
  loadUsers()
}

async function loadUsers() {
  try {
    var res = await sb.rpc('hub_users_list')
    if (res.error || !res.data) { state.allUsers = []; state.loading = false; render(); return }
    state.allUsers = res.data
    state.loading = false
    if (state.user) {
      var fresh = res.data.find(function (u) { return u.id === state.user.id })
      if (!fresh) { logout(); return }
      var appsChanged = JSON.stringify(state.user.apps) !== JSON.stringify(fresh.apps)
      var adminChanged = state.user.is_admin !== (fresh.is_admin || false)
      if (appsChanged || adminChanged) {
        state.user.apps = fresh.apps
        state.user.is_admin = fresh.is_admin || false
        try { localStorage.setItem('ambria_hub', JSON.stringify(state.user)) } catch (e) {}
        renderHub()
      }
    } else {
      renderPicker()
    }
  } catch (e) {
    state.allUsers = []
    state.loading = false
    if (!state.user) renderPicker()
  }
}

function selectUser(u) {
  if (!u.has_pin) {
    // No PIN set — allow direct access
    state.user = { id: u.id, name: u.name, apps: u.apps, is_admin: u.is_admin || false }
    try { localStorage.setItem('ambria_hub', JSON.stringify(state.user)) } catch (e) {}
    renderHub()
    return
  }
  showLoginPin(u)
}

function showLoginPin(u) {
  var overlay = document.createElement('div')
  overlay.className = 'pin-modal-bg'
  overlay.innerHTML =
    '<div class="pin-box">' +
      '<div class="pick-avatar" style="margin:0 auto 12px;width:48px;height:48px;font-size:20px;border-radius:14px">' + u.name.charAt(0) + '</div>' +
      '<div class="pin-title">' + u.name + '</div>' +
      '<div class="pin-sub">Enter your PIN to continue</div>' +
      '<input class="pin-input" id="login-pin" type="password" inputmode="numeric" maxlength="6" placeholder="PIN">' +
      '<div class="pin-err" id="login-pin-err" style="display:none"></div>' +
      '<div class="pin-btns">' +
        '<button class="mbtn mbtn-cancel" id="login-pin-cancel">Cancel</button>' +
        '<button class="mbtn mbtn-save" id="login-pin-go">Enter</button>' +
      '</div>' +
    '</div>'
  document.body.appendChild(overlay)

  var pinInput = document.getElementById('login-pin')
  var errEl = document.getElementById('login-pin-err')
  pinInput.focus()

  overlay.addEventListener('click', function (e) { if (e.target === overlay) overlay.remove() })
  document.getElementById('login-pin-cancel').addEventListener('click', function () { overlay.remove() })

  async function verifyLogin() {
    var pin = pinInput.value.trim()
    if (!pin) { errEl.textContent = 'Enter PIN'; errEl.style.display = 'block'; return }
    var { data, error } = await sb.rpc('hub_verify_login_pin', { p_user_id: u.id, p_pin: pin })
    if (error || !data) {
      errEl.textContent = 'Wrong PIN'
      errEl.style.display = 'block'
      pinInput.value = ''
      pinInput.focus()
      return
    }
    overlay.remove()
    state.user = { id: u.id, name: u.name, apps: u.apps, is_admin: u.is_admin || false }
    try { localStorage.setItem('ambria_hub', JSON.stringify(state.user)) } catch (e) {}
    renderHub()
  }

  document.getElementById('login-pin-go').addEventListener('click', verifyLogin)
  pinInput.addEventListener('keydown', function (e) { if (e.key === 'Enter') verifyLogin() })
}

function logout() {

function parseBulkCSVLine(line) {
  var result = []
  var current = ''
  var inQuotes = false
  for (var i = 0; i < line.length; i++) {
    var ch = line[i]
    if (ch === '"') inQuotes = !inQuotes
    else if (ch === ',' && !inQuotes) { result.push(current); current = '' }
    else current += ch
  }
  result.push(current)
  return result
}

function handleBulkFile(e) {
  var f = e.target.files[0]
  if (!f) return
  var reader = new FileReader()
  reader.onload = function (ev) { parseBulkCSV(ev.target.result) }
  reader.readAsText(f)
}

function parseBulkCSV(text) {
  var lines = text.split('\n').map(function (l) { return l.trim() }).filter(Boolean)
  if (lines.length < 1) { bulkState.errors = [{ msg: 'File is empty' }]; renderAdmin(); return }

  var header = lines[0].toLowerCase()
  var startIdx = header.indexOf('name') !== -1 ? 1 : 0

  var existingNames = {}
  adminState.users.forEach(function (u) { existingNames[u.name.toLowerCase().trim()] = true })

  var errs = []
  var seen = {}
  var rows = []

  for (var i = startIdx; i < lines.length; i++) {
    var cols = parseBulkCSVLine(lines[i])
    var rowNum = i + 1
    var name = (cols[0] || '').trim()
    var pin = (cols[1] || '').trim().replace(/[^0-9]/g, '')

    if (!name) { errs.push({ msg: 'Row ' + rowNum + ': name is empty' }); continue }
    if (seen[name.toLowerCase()]) { errs.push({ msg: 'Row ' + rowNum + ': duplicate name "' + name + '" in CSV — skipped' }); continue }
    seen[name.toLowerCase()] = true
    if (existingNames[name.toLowerCase()]) { errs.push({ msg: 'Row ' + rowNum + ': "' + name + '" already exists in the hub — will create a second entry unless removed' }) }

    rows.push({ name: name, pin: pin, apps: [], active: true, is_admin: false })
  }

  bulkState.rows = rows
  bulkState.errors = errs
  bulkState.step = rows.length > 0 ? 'configure' : 'upload'
  renderAdmin()
}

function syncBulkInputsFromDOM() {
  document.querySelectorAll('.bulk-name').forEach(function (el) {
    var idx = Number(el.dataset.idx)
    if (bulkState.rows[idx]) bulkState.rows[idx].name = el.value
  })
  document.querySelectorAll('.bulk-pin').forEach(function (el) {
    var idx = Number(el.dataset.idx)
    if (bulkState.rows[idx]) bulkState.rows[idx].pin = el.value.replace(/[^0-9]/g, '')
  })
}

function toggleBulkDefaultApp(appKey) {
  var idx = bulkState.defaultApps.indexOf(appKey)
  if (idx === -1) bulkState.defaultApps.push(appKey)
  else bulkState.defaultApps.splice(idx, 1)
  renderAdmin()
}

function toggleBulkRowApp(rowIdx, appKey) {
  var row = bulkState.rows[rowIdx]
  var idx = row.apps.indexOf(appKey)
  if (idx === -1) row.apps.push(appKey)
  else row.apps.splice(idx, 1)
  renderAdmin()
}

function setBulkRowActive(rowIdx, val) {
  bulkState.rows[rowIdx].active = val
  renderAdmin()
}

function setBulkRowAdmin(rowIdx, val) {
  bulkState.rows[rowIdx].is_admin = val
  renderAdmin()
}

function removeBulkRow(rowIdx) {
  bulkState.rows.splice(rowIdx, 1)
  renderAdmin()
}

function applyBulkDefaultsToAll() {
  bulkState.rows.forEach(function (r) {
    r.apps = bulkState.defaultApps.slice()
    r.active = bulkState.defaultActive
    r.is_admin = bulkState.defaultAdmin
  })
  renderAdmin()
}

async function doBulkImport() {
  bulkState.step = 'importing'
  bulkState.progress = { done: 0, total: bulkState.rows.length, failed: [] }
  renderAdmin()

  for (var i = 0; i < bulkState.rows.length; i++) {
    var r = bulkState.rows[i]
    try {
      var res = await sb.rpc('hub_admin_upsert', {
        p_id: 0,
        p_name: r.name,
        p_apps: r.apps,
        p_pin: r.pin || '',
        p_active: r.active !== false,
        p_is_admin: r.is_admin || false,
      })
      if (res.error) throw res.error
      bulkState.progress.done++
    } catch (err) {
      bulkState.progress.failed.push({ name: r.name, msg: (err && err.message) || 'Failed' })
    }
    renderAdmin()
  }

  bulkState.step = 'done'
  renderAdmin()
  loadAdminUsers()
  loadUsers()
}

  var q = adminState.search.toLowerCase()

      var u = filtered[i]

      listHtml +=
        '<div class="admin-row' + (u.active ? '' : ' inactive') + '" data-idx="' + i + '">' +
          '<div class="pick-avatar">' + u.name.charAt(0) + '</div>' +
          '<div class="admin-meta">' +
            '<div class="admin-meta-name">' + u.name + (!u.active ? ' <span style="color:#ef4444;font-size:10px">INACTIVE</span>' : '') + '</div>' +
            '<div class="admin-meta-sub">' + (u.pin || 'No PIN') + '</div>' +
            '<div class="admin-badges">' + badges + '</div>' +
          '</div>' +
          '<div class="admin-actions">' +
            '<button class="abtn admin-edit" data-idx="' + i + '">Edit</button>' +
            '<button class="abtn abtn-del admin-del" data-idx="' + i + '">✕</button>' +
          '</div>' +
        '</div>'
    }
  }

  var modalHtml = ''
  if (adminState.editing) {
    var e = adminState.editing
    var appKeys = Object.keys(APPS)
    var appChecks = ''
    for (var k = 0; k < appKeys.length; k++) {
      var key = appKeys[k]
      var isOn = e.apps.indexOf(key) !== -1
      appChecks += '<div class="modal-check' + (isOn ? ' checked' : '') + '" data-app="' + key + '">' + APPS[key].icon + ' ' + APPS[key].label + '</div>'
    }
    modalHtml =
      '<div class="modal-bg" id="modal-bg">' +
        '<div class="modal-box">' +
          '<div class="modal-title">' + (e.id ? 'Edit User' : 'Add User') + '</div>' +
          '<div class="modal-field">' +
            '<div class="modal-label">Name</div>' +
            '<input class="modal-input" id="m-name" value="' + (e.name || '') + '" placeholder="Full name">' +
          '</div>' +
          '<div class="modal-field">' +
            '<div class="modal-label">PIN (optional)</div>' +
            '<input class="modal-input" id="m-pin" value="' + (e.pin || '') + '" placeholder="4-digit PIN">' +
          '</div>' +
          '<div class="modal-field">' +
            '<div class="modal-label">Apps</div>' +
            '<div class="modal-checks" id="m-apps">' + appChecks + '</div>' +
          '</div>' +
          '<div class="modal-field">' +
            '<label class="modal-toggle" id="m-active">' +
              '<input type="checkbox"' + (e.active !== false ? ' checked' : '') + '> Active' +
            '</label>' +
          '</div>' +
          '<div class="modal-field">' +
            '<label class="modal-toggle" id="m-admin">' +
              '<input type="checkbox"' + (e.is_admin ? ' checked' : '') + '> Hub Admin' +
            '</label>' +
          '</div>' +
          '<div class="modal-btns">' +
            '<button class="mbtn mbtn-cancel" id="m-cancel">Cancel</button>' +
            '<button class="mbtn mbtn-save" id="m-save">Save</button>' +
          '</div>' +
        '</div>' +
      '</div>'
  }

  var bulkModalHtml = ''
  if (bulkState.open) {
    var appKeysB = Object.keys(APPS)

    var bulkErrorsHtml = ''
    if (bulkState.errors.length > 0) {
      bulkErrorsHtml = '<div class="bulk-errors">' +
        bulkState.errors.map(function (er) { return '<p>' + er.msg + '</p>' }).join('') +
        '</div>'
    }

    if (bulkState.step === 'upload') {
      bulkModalHtml =

          '<div class="modal-box wide">' +

            '<div class="bulk-drop">' +

    } else if (bulkState.step === 'configure') {

              '</div>' +
              '<div class="modal-checks">' + defaultChecks + '</div>' +
              '<div class="bulk-toggles">' +
                '<label class="modal-toggle" id="bulk-default-active"><input type="checkbox"' + (bulkState.defaultActive ? ' checked' : '') + '> Active</label>' +
                '<label class="modal-toggle" id="bulk-default-admin"><input type="checkbox"' + (bulkState.defaultAdmin ? ' checked' : '') + '> Hub Admin</label>' +
              '</div>' +
            '</div>' +
            '<div class="bulk-list">' + rowsHtml + '</div>' +
            '<div class="modal-btns">' +
              '<button class="mbtn mbtn-cancel" id="bulk-back">Back</button>' +
              '<button class="mbtn mbtn-save" id="bulk-import-btn"' + (bulkState.rows.length === 0 ? ' disabled' : '') + '>Import ' + bulkState.rows.length + ' User' + (bulkState.rows.length !== 1 ? 's' : '') + '</button>' +
            '</div>' +
          '</div>' +
        '</div>'
    } else if (bulkState.step === 'importing') {
      var pctB = bulkState.progress.total > 0 ? Math.round((bulkState.progress.done / bulkState.progress.total) * 100) : 0
      bulkModalHtml =
        '<div class="modal-bg">' +
          '<div class="modal-box wide">' +
            '<div class="modal-title">Importing…</div>' +
            '<div class="bulk-progress-bar"><div class="bulk-progress-fill" style="width:' + pctB + '%"></div></div>' +
            '<p style="font-size:13px;color:rgba(0,0,0,.5);text-align:center">' + bulkState.progress.done + ' of ' + bulkState.progress.total + ' processed…</p>' +
            (bulkState.progress.failed.length > 0 ? '<p style="font-size:12px;color:#dc2626;text-align:center;margin-top:6px">' + bulkState.progress.failed.length + ' failed so far</p>' : '') +
          '</div>' +
        '</div>'
    } else if (bulkState.step === 'done') {
      var failedListHtml = ''
      if (bulkState.progress.failed.length > 0) {
        failedListHtml = '<div class="bulk-errors">' +
          bulkState.progress.failed.map(function (f) { return '<p>' + f.name + ': ' + f.msg + '</p>' }).join('') +
          '</div>'
      }
      bulkModalHtml =
        '<div class="modal-bg">' +
          '<div class="modal-box wide">' +
            '<div class="modal-title">Import Complete</div>' +
            '<p style="font-size:14px;font-weight:600;color:#1c1c1e;text-align:center;margin-bottom:10px">' + bulkState.progress.done + ' of ' + bulkState.progress.total + ' users imported</p>' +
            failedListHtml +
            '<div class="modal-btns"><button class="mbtn mbtn-save" id="bulk-done">Done</button></div>' +
          '</div>' +
        '</div>'
    }
  }

  app.innerHTML =
    '<div class="admin-screen">' +
      '<div class="admin-header">' +
        '<div>' +
          '<div class="admin-title">Manage Users</div>' +
          '<div class="admin-sub">' + adminState.users.length + ' total users</div>' +
        '</div>' +
        '<div style="display:flex;gap:6px">' +
          '<button class="abtn abtn-add" id="admin-add">+ Add</button>' +
          '<button class="abtn" id="admin-bulk">+ Bulk Import</button>' +
          '<button class="abtn" id="admin-back">← Back</button>' +
        '</div>' +
      '</div>' +
      '<div class="admin-search">' +
        '<input type="text" id="admin-search" placeholder="Search users..." value="' + adminState.search + '">' +
      '</div>' +
      '<div class="admin-list">' + listHtml + '</div>' +
      '<div class="footer">Ambria <span>●</span> Hub Admin</div>' +
    '</div>' +
    modalHtml +
    bulkModalHtml

  // Wire events
  var backBtn = document.getElementById('admin-back')
  if (backBtn) backBtn.addEventListener('click', function () { renderHub() })

  var addBtn = document.getElementById('admin-add')
  if (addBtn) addBtn.addEventListener('click', function () { openEditModal(null) })

  var bulkBtn = document.getElementById('admin-bulk')
  if (bulkBtn) bulkBtn.addEventListener('click', openBulkImport)

  var searchEl = document.getElementById('admin-search')
  if (searchEl) searchEl.addEventListener('input', function (ev) {
    adminState.search = ev.target.value
    renderAdmin()
    var el2 = document.getElementById('admin-search')
    if (el2) { el2.focus(); el2.setSelectionRange(adminState.search.length, adminState.search.length) }
  })

  app.querySelectorAll('.admin-edit').forEach(function (el) {
    el.addEventListener('click', function (ev) {
      ev.stopPropagation()
      openEditModal(filtered[Number(el.dataset.idx)])
    })
  })

  app.querySelectorAll('.admin-del').forEach(function (el) {
    el.addEventListener('click', function (ev) {
      ev.stopPropagation()
      deleteAdminUser(filtered[Number(el.dataset.idx)].id)
    })
  })

  // Modal events
  var modalBg = document.getElementById('modal-bg')
  if (modalBg) modalBg.addEventListener('click', function (ev) {
    if (ev.target === modalBg) { adminState.editing = null; renderAdmin() }
  })

  var cancelBtn = document.getElementById('m-cancel')
  if (cancelBtn) cancelBtn.addEventListener('click', function () { adminState.editing = null; renderAdmin() })

  app.querySelectorAll('.modal-check').forEach(function (el) {
    el.addEventListener('click', function () {
      if (!adminState.editing) return
      var appKey = el.dataset.app
      var idx = adminState.editing.apps.indexOf(appKey)
      if (idx === -1) adminState.editing.apps.push(appKey)
      else adminState.editing.apps.splice(idx, 1)
      renderAdmin()
    })
  })

  // Bulk import events
  if (bulkState.open) {
    var bulkBg = document.getElementById('bulk-modal-bg')
    if (bulkBg) bulkBg.addEventListener('click', function (ev) { if (ev.target === bulkBg) closeBulkImport() })

    var bulkCancel = document.getElementById('bulk-cancel')
    if (bulkCancel) bulkCancel.addEventListener('click', closeBulkImport)

    var bulkFile = document.getElementById('bulk-file')
    if (bulkFile) bulkFile.addEventListener('change', handleBulkFile)

    var bulkTpl = document.getElementById('bulk-download-tpl')
    if (bulkTpl) bulkTpl.addEventListener('click', downloadBulkTemplate)

    var bulkBack = document.getElementById('bulk-back')
    if (bulkBack) bulkBack.addEventListener('click', function () { bulkState.step = 'upload'; renderAdmin() })

    var bulkApplyAll = document.getElementById('bulk-apply-all')
    if (bulkApplyAll) bulkApplyAll.addEventListener('click', applyBulkDefaultsToAll)

    app.querySelectorAll('.bulk-default-app-check').forEach(function (el) {
      el.addEventListener('click', function () { toggleBulkDefaultApp(el.dataset.app) })
    })

    var defActiveEl = document.getElementById('bulk-default-active')
    if (defActiveEl) defActiveEl.addEventListener('change', function () { bulkState.defaultActive = defActiveEl.querySelector('input').checked })

    var defAdminEl = document.getElementById('bulk-default-admin')
    if (defAdminEl) defAdminEl.addEventListener('change', function () { bulkState.defaultAdmin = defAdminEl.querySelector('input').checked })

    app.querySelectorAll('.bulk-row-app-check').forEach(function (el) {
      el.addEventListener('click', function () { toggleBulkRowApp(Number(el.dataset.idx), el.dataset.app) })
    })

    app.querySelectorAll('.bulk-row-active').forEach(function (el) {
      el.addEventListener('change', function () { setBulkRowActive(Number(el.dataset.idx), el.querySelector('input').checked) })
    })

    app.querySelectorAll('.bulk-row-admin').forEach(function (el) {
      el.addEventListener('change', function () { setBulkRowAdmin(Number(el.dataset.idx), el.querySelector('input').checked) })
    })

    app.querySelectorAll('.bulk-row-del').forEach(function (el) {
      el.addEventListener('click', function () { removeBulkRow(Number(el.dataset.idx)) })
    })

    var bulkImportBtn = document.getElementById('bulk-import-btn')
    if (bulkImportBtn) bulkImportBtn.addEventListener('click', doBulkImport)

    var bulkDoneBtn = document.getElementById('bulk-done')
    if (bulkDoneBtn) bulkDoneBtn.addEventListener('click', closeBulkImport)
  }

  var activeEl = document.getElementById('m-active')
  if (activeEl) activeEl.addEventListener('change', function () {
    adminState.editing.active = activeEl.querySelector('input').checked
  })

  var adminEl = document.getElementById('m-admin')
  if (adminEl) adminEl.addEventListener('change', function () {
    adminState.editing.is_admin = adminEl.querySelector('input').checked
  })

  var saveBtn = document.getElementById('m-save')
  if (saveBtn) saveBtn.addEventListener('click', function () {
    var nameVal = document.getElementById('m-name').value.trim()
    var pinVal = document.getElementById('m-pin').value.trim()
    if (!nameVal) { alert('Name required'); return }
    adminState.editing.name = nameVal
    adminState.editing.pin = pinVal
    saveAdminUser(adminState.editing)
  })
}

function render() {
  if (state.user) renderHub()
  else renderPicker()
}

function renderPicker() {
  var q = state.search.toLowerCase()
  var filtered = state.allUsers.filter(function (u) {
    return !q || u.name.toLowerCase().indexOf(q) !== -1
  })

  var listHtml = ''
  if (state.loading) {
    listHtml = '<div class="pick-empty">Loading...</div>'
  } else if (filtered.length === 0) {
    listHtml = '<div class="pick-empty">' + (q ? 'No match for "' + state.search + '"' : 'No users found') + '</div>'
  } else {
    for (var i = 0; i < filtered.length; i++) {
      var u = filtered[i]
      listHtml +=
        '<div class="pick-item" data-idx="' + i + '">' +
          '<div class="pick-avatar">' + u.name.charAt(0) + '</div>' +
          '<div>' +
            '<div class="pick-name">' + u.name + '</div>' +
          '</div>' +
        '</div>'
    }
  }

  app.innerHTML =
    '<div class="pick-screen">' +
      '<div class="pick-header">' +
        '<div class="logo">A</div><br>' +
        '<div class="brand">Ambria</div>' +
      '</div>' +
      '<div class="pick-search">' +
        '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>' +
        '<input type="text" id="hub-search" placeholder="Search your name..." value="' + state.search + '">' +
      '</div>' +
      '<div class="pick-count">' + filtered.length + ' people</div>' +
      '<div class="pick-list">' + listHtml + '</div>' +
      '<div class="footer">Ambria <span>●</span> Hub</div>' +
    '</div>'

  var searchInput = document.getElementById('hub-search')
  searchInput.addEventListener('input', function (e) {
    state.search = e.target.value
    renderPicker()
    var el = document.getElementById('hub-search')
    if (el) { el.focus(); el.setSelectionRange(state.search.length, state.search.length) }
  })

  app.querySelectorAll('.pick-item').forEach(function (el) {
    el.addEventListener('click', function () {
      var idx = Number(el.dataset.idx)
      selectUser(filtered[idx])
    })
  })
}

function renderHub() {
  var u = state.user
  var cards = ''
  for (var i = 0; i < u.apps.length; i++) {
    var key = u.apps[i]
    var a = APPS[key]
    if (!a) continue
    cards +=
      '<a href="' + a.url + '" class="card ' + a.css + '">' +
        '<div class="card-icon">' + a.icon + '</div>' +
        '<div class="card-label">' + a.label + '</div>' +
        '<div class="card-desc">' + a.desc + '</div>' +
      '</a>'
  }

  app.innerHTML =
    '<div class="hub-screen">' +
      '<div class="hub-header">' +
        '<div class="hub-user">' +
          '<div class="avatar">' + u.name.charAt(0) + '</div>' +
          '<div>' +
            '<div class="hub-name">' + u.name + '</div>' +
            '<div class="hub-sub">Ambria</div>' +
          '</div>' +
        '</div>' +
        (u.is_admin ? '<button class="gear-btn" id="admin-btn">⚙ Admin</button> ' : '') +
        '<button class="logout-btn" id="logout">Switch</button>' +
      '</div>' +
      '<div class="cards">' + cards + '</div>' +
      '<div class="footer">Ambria <span>●</span> Hub</div>' +
    '</div>'

  document.getElementById('logout').addEventListener('click', logout)
  var adminBtn = document.getElementById('admin-btn')
  if (adminBtn) adminBtn.addEventListener('click', function () { showAdminPinPrompt() })
}

init()

// Fix stale cache: re-fetch user data when app returns to foreground
document.addEventListener('visibilitychange', async function () {
  if (document.visibilityState !== 'visible' || !state.user) return
  try {
    var res = await sb.rpc('hub_users_list')
    if (res.error || !res.data) return
    state.allUsers = res.data
    var fresh = res.data.find(function (u) { return u.id === state.user.id })
    if (!fresh) {
      logout()
      return
    }
    var appsChanged = JSON.stringify(state.user.apps) !== JSON.stringify(fresh.apps)
    var adminChanged = state.user.is_admin !== (fresh.is_admin || false)
    if (appsChanged || adminChanged) {
      state.user.apps = fresh.apps
      state.user.is_admin = fresh.is_admin || false
      try { localStorage.setItem('ambria_hub', JSON.stringify(state.user)) } catch (e) {}
      renderHub()
    }
  } catch (e) {}
})

if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js')
</script>
